<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CleanPro TX — New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0A1628;color:rgba(255,255,255,.9);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:30px 24px;}
.logo{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;margin-bottom:6px;}
.logo span{color:#2DD4BF;}
h1{font-family:'Sora',sans-serif;font-size:22px;margin:14px 0 6px;}
p{font-size:14px;color:rgba(255,255,255,.6);line-height:1.5;margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:#fff;font-size:16px;margin-bottom:14px;font-family:inherit;}
input:focus{outline:2px solid #2DD4BF;border-color:transparent;}
button{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#2DD4BF,#14B8A4);
  color:#0A1628;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
button:disabled{opacity:.6;cursor:default;}
.msg{font-size:13.5px;margin-top:14px;line-height:1.5;min-height:20px;}
.msg.err{color:#FCA5A5;}.msg.ok{color:#5EEAD4;}
a{color:#2DD4BF;}
.hide{display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Clean<span>Pro</span> TX</div>

  <div id="loading"><p>Checking your reset link…</p></div>

  <form id="form" class="hide" onsubmit="return savePassword(event)">
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters.</p>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required/>
    <label for="p2">Repeat new password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required/>
    <button id="save" type="submit">Save new password</button>
    <div id="msg" class="msg"></div>
  </form>

  <div id="bad" class="hide">
    <h1>This link expired</h1>
    <p>Reset links work once and expire after a short time. Ask for a new one.</p>
    <a href="/login.html">Back to sign in</a>
  </div>
</div>

<script>
var sb = supabase.createClient(
  'https://yfqoncqoerleoaqxvaie.supabase.co',
  'sb_publishable_cbrrFqLqJMkUXJ4icNOn9g_lEv4NneF'
);
var ready = false;
function show(id){ ['loading','form','bad'].forEach(function(x){ document.getElementById(x).classList.toggle('hide', x!==id); }); }

// El enlace del correo trae la sesion de recuperacion en la URL
sb.auth.onAuthStateChange(function(event, session){
  if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) { ready = true; show('form'); }
});
// Enlaces nuevos con ?code=...
(async function(){
  var code = new URLSearchParams(location.search).get('code');
  if (code) { try { await sb.auth.exchangeCodeForSession(code); } catch (e) {} }
  var r = await sb.auth.getSession();
  if (r.data && r.data.session) { ready = true; show('form'); }
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error')) { show('bad'); return; }
  setTimeout(function(){ if (!ready) show('bad'); }, 4000);
})();

async function savePassword(e){
  e.preventDefault();
  var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  var msg = document.getElementById('msg'), btn = document.getElementById('save');
  msg.className = 'msg';
  if (p1.length < 8) { msg.textContent = 'Use at least 8 characters.'; msg.classList.add('err'); return false; }
  if (p1 !== p2) { msg.textContent = 'The passwords do not match.'; msg.classList.add('err'); return false; }
  btn.disabled = true; btn.textContent = 'Saving…';
  var r = await sb.auth.updateUser({ password: p1 });
  if (r.error) {
    msg.textContent = r.error.message; msg.classList.add('err');
    btn.disabled = false; btn.textContent = 'Save new password';
    return false;
  }
  msg.textContent = 'Password saved. Opening your dashboard…'; msg.classList.add('ok');
  setTimeout(function(){ location.href = '/dashboard.html'; }, 1200);
  return false;
}
</script>
</body>
</html>
