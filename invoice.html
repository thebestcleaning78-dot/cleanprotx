<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Invoice — The Best Cleaning LLC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#F0F4FF;min-height:100vh;padding:20px;}
.container{max-width:680px;margin:0 auto;}
.invoice{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.inv-header{background:linear-gradient(135deg,#1E1B4B 0%,#7C3AED 60%,#10B981 100%);padding:36px 40px;display:flex;justify-content:space-between;align-items:flex-start;}
.inv-logo{display:flex;align-items:center;gap:12px;}
.inv-logo img{height:52px;object-fit:contain;filter:brightness(10);}
.inv-logo-text{color:#fff;}
.inv-logo-name{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;}
.inv-logo-sub{font-size:12px;opacity:.7;margin-top:2px;}
.inv-badge{text-align:right;}
.inv-badge-label{font-size:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:.08em;}
.inv-badge-num{font-family:'Sora',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1.1;}
.inv-body{padding:36px 40px;}
.inv-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:12px;font-weight:600;margin-bottom:24px;}
.inv-status.draft{background:#F3F4F6;color:#6B7280;}
.inv-status.sent{background:#DBEAFE;color:#1D4ED8;}
.inv-status.viewed{background:#FEF3C7;color:#92400E;}
.inv-status.paid{background:#D1FAE5;color:#065F46;}
.inv-status.overdue{background:#FEE2E2;color:#991B1B;}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px;}
.inv-field-label{font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.inv-field-val{font-size:15px;font-weight:600;color:#111827;}
.inv-field-sub{font-size:12px;color:#6B7280;margin-top:2px;}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:24px;border-radius:12px;overflow:hidden;border:1px solid #E5E7EB;}
.inv-table thead th{background:#F9FAFB;padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;}
.inv-table tbody td{padding:16px;font-size:14px;color:#111827;border-top:1px solid #E5E7EB;}
.inv-totals{background:#F9FAFB;border-radius:12px;padding:20px 24px;margin-bottom:28px;}
.inv-total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
.inv-total-row.final{border-top:2px solid #111827;margin-top:8px;padding-top:16px;}
.inv-total-label{font-size:14px;color:#6B7280;}
.inv-total-val{font-size:14px;font-weight:600;color:#111827;}
.inv-total-row.final .inv-total-label{font-size:16px;font-weight:700;color:#111827;}
.inv-total-row.final .inv-total-val{font-size:28px;font-weight:800;color:#7C3AED;}
.pay-btn{display:block;width:100%;background:linear-gradient(135deg,#7C3AED,#10B981);color:#fff;text-align:center;padding:18px;border-radius:14px;text-decoration:none;font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;transition:opacity .2s;}
.pay-btn:hover{opacity:.9;}
.paid-banner{background:#D1FAE5;border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;}
.paid-banner-icon{font-size:36px;margin-bottom:8px;}
.paid-banner-text{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:#065F46;}
.paid-banner-sub{font-size:13px;color:#065F46;opacity:.8;margin-top:4px;}
.inv-note{background:#F9F7FF;border-left:4px solid #7C3AED;padding:14px 18px;border-radius:8px;font-size:13px;color:#4B5563;margin-bottom:20px;}
.inv-footer{background:#1E1B4B;padding:20px 40px;text-align:center;}
.inv-footer p{color:rgba(255,255,255,0.5);font-size:12px;}
.inv-footer a{color:rgba(255,255,255,0.7);text-decoration:none;}
.contact-row{display:flex;justify-content:center;gap:24px;margin-top:10px;}
.contact-item{color:rgba(255,255,255,0.6);font-size:12px;}
.loading{text-align:center;padding:80px 40px;color:#6B7280;}
.loading-spinner{width:40px;height:40px;border:3px solid #E5E7EB;border-top-color:#7C3AED;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{text-align:center;padding:80px 40px;color:#EF4444;}
@media(max-width:600px){
  .inv-header{padding:24px 20px;flex-direction:column;gap:16px;}
  .inv-badge{text-align:left;}
  .inv-body{padding:24px 20px;}
  .inv-grid{grid-template-columns:1fr;}
  .inv-footer{padding:20px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="invoice" id="invoice-wrap">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Loading invoice...</p>
    </div>
  </div>
</div>

<script>
var sb = supabase.createClient(
  'https://kpahdvgwpeyggilujzsd.supabase.co',
  'sb_publishable_5WdCIgjYNfjJeu1kZpmJQw_Ymt3UjMx'
);

function fmt(v){ return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtD(d){ if(!d) return '--'; var clean=d.toString().slice(0,10); return new Date(clean+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }

async function loadInvoice(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if(!id){ showError('Invoice not found.'); return; }

  var res = await sb.from('invoices').select('*').eq('id', id).single();
  if(res.error || !res.data){ showError('Invoice not found.'); return; }
  var inv = res.data;

  // Mark as Viewed if not already paid
  if(inv.status === 'Sent' || inv.status === 'Draft'){
    await sb.from('invoices').update({ status: 'Viewed', viewed_at: new Date().toISOString() }).eq('id', id);
    inv.status = 'Viewed';
  }

  renderInvoice(inv);
}

function renderInvoice(inv){
  var invNum = String(inv.invoice_number||0).padStart(3,'0');
  var amount = Number(inv.amount||0);
  var isPaid = inv.status === 'Paid';
  var isOverdue = inv.status === 'Overdue';

  var statusClass = {
    'Draft':'draft','Sent':'sent','Viewed':'viewed',
    'Paid':'paid','Overdue':'overdue'
  }[inv.status] || 'draft';

  var statusIcon = {
    'Draft':'📝','Sent':'📬','Viewed':'👀',
    'Paid':'✅','Overdue':'⚠️'
  }[inv.status] || '📄';

  document.title = 'Invoice #'+invNum+' — The Best Cleaning LLC';

  document.getElementById('invoice-wrap').innerHTML =
    '<div class="inv-header">'
    +'<div class="inv-logo">'
    +'<img src="https://kpahdvgwpeyggilujzsd.supabase.co/storage/v1/object/public/assets/tbc_logo.png" onerror="this.style.display=\'none\'"/>'
    +'<div class="inv-logo-text"><div class="inv-logo-name">The Best Cleaning LLC</div><div class="inv-logo-sub">Professional Cleaning Services · Lubbock, TX</div></div>'
    +'</div>'
    +'<div class="inv-badge"><div class="inv-badge-label">Invoice</div><div class="inv-badge-num">#'+invNum+'</div></div>'
    +'</div>'

    +'<div class="inv-body">'
    +'<span class="inv-status '+statusClass+'">'+statusIcon+' '+inv.status+'</span>'

    +'<div class="inv-grid">'
    +'<div><div class="inv-field-label">Bill To</div><div class="inv-field-val">'+(inv.client_name||'--')+'</div>'+(inv.client_email?'<div class="inv-field-sub">'+inv.client_email+'</div>':'')+'</div>'
    +'<div>'
    +'<div style="margin-bottom:14px;"><div class="inv-field-label">Issue Date</div><div class="inv-field-val">'+fmtD(inv.issue_date||inv.created_at)+'</div></div>'
    +'<div><div class="inv-field-label">Due Date</div><div class="inv-field-val" style="color:'+(isOverdue?'#EF4444':'#111827')+'">'+fmtD(inv.due_date)+'</div></div>'
    +'</div>'
    +'</div>'

    +'<table class="inv-table">'
    +'<thead><tr><th>Description</th><th style="text-align:right;">Amount</th></tr></thead>'
    +'<tbody><tr><td><strong>'+(inv.service||'Cleaning Service')+'</strong>'+(inv.notes&&inv.notes!=='Auto-generated from job completion'?'<br><span style="font-size:12px;color:#6B7280;">'+inv.notes+'</span>':'')+'</td><td style="text-align:right;font-weight:600;">'+fmt(amount)+'</td></tr></tbody>'
    +'</table>'

    +'<div class="inv-totals">'
    +'<div class="inv-total-row"><span class="inv-total-label">Subtotal</span><span class="inv-total-val">'+fmt(amount)+'</span></div>'
    +(Number(inv.discount||0)>0?'<div class="inv-total-row"><span class="inv-total-label">Discount</span><span class="inv-total-val" style="color:#10B981;">-'+fmt(inv.discount)+'</span></div>':'')
    +(Number(inv.tax_rate||0)>0?'<div class="inv-total-row"><span class="inv-total-label">Tax ('+inv.tax_rate+'%)</span><span class="inv-total-val">'+fmt(amount*inv.tax_rate/100)+'</span></div>':'')
    +'<div class="inv-total-row final"><span class="inv-total-label">Total Due</span><span class="inv-total-val">'+fmt(amount)+'</span></div>'
    +'</div>'

    +(isPaid
      ? '<div class="paid-banner"><div class="paid-banner-icon">🎉</div><div class="paid-banner-text">Payment Complete!</div><div class="paid-banner-sub">Thank you for your payment. Your receipt has been sent.</div></div>'
      : (inv.payment_url ? '<a href="'+inv.payment_url+'" class="pay-btn" target="_blank">💳 Pay Now — '+fmt(amount)+'</a>' : '')
    )

    +'<p style="text-align:center;font-size:12px;color:#9CA3AF;margin-bottom:20px;">Questions? Call or text <a href="tel:+18066201613" style="color:#7C3AED;">(806) 620-1613</a></p>'
    +'</div>'

    +'<div class="inv-footer">'
    +'<p>The Best Cleaning LLC — Lubbock, TX</p>'
    +'<div class="contact-row">'
    +'<span class="contact-item">📞 (806) 620-1613</span>'
    +'<span class="contact-item">✉️ thebestcleaning78@gmail.com</span>'
    +'<span class="contact-item"><a href="https://thebestcleaningtx.com">thebestcleaningtx.com</a></span>'
    +'</div>'
    +'</div>';
}

function showError(msg){
  document.getElementById('invoice-wrap').innerHTML = '<div class="error"><div style="font-size:48px;margin-bottom:16px;">😕</div><p>'+msg+'</p></div>';
}

loadInvoice();
</script>
</body>
</html>
